actor:
  model:
    model_type: openvla_oft
    implement_version: official
    model_path: /home/zy/code/rlinf_open_source/RLinf/model/RLinf-OpenVLAOFT-RoboTwin-SFT-place_empty_cup
    precision: bf16
    value_type: action_level
    action_dim: 14
    num_action_chunks: 25
    use_proprio: true
    use_film: false
    unnorm_key: place_empty_cup_1k
    center_crop: true
    max_prompt_length: 512
    vocab_size: 32000
    hidden_size: 4096
    add_value_head: false
    image_size:
    - 224
    - 224
    is_lora: true
    lora_rank: 32
    lora_path: null
    num_images_in_input: 1
    attn_implementation: flash_attention_2
    low_cpu_mem_usage: true
    trust_remote_code: true
    policy_setup: widowx_bridge
    proprio_dim: 14
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: true
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    fsdp_size: -1
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 8
  seed: 1234
  enable_offload: true
  optim:
    lr: 0.0001
    value_lr: 1.0e-05
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-05
    weight_decay: 0.01
    clip_grad: 1.0
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0
runner:
