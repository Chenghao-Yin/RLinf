# SAC training config for the Junpu place-workpiece task.
#
# Quick-start:
#   cd RLinf
#   GENIESIM_ROOT=.. \
#   python examples/embodiment/train_embodied_agent.py \
#       --config-path examples/embodiment/config \
#       --config-name geniesim_junpu_sac \
#       ++algorithm.demo_buffer.load_path=/path/to/demo_buffer
#
# Or without a demo buffer (pure online SAC):
#   python examples/embodiment/train_embodied_agent.py \
#       --config-path examples/embodiment/config \
#       --config-name geniesim_junpu_sac

defaults:
  - env/geniesim_junpu_place_workpiece@env.train
  - env/geniesim_junpu_place_workpiece@env.eval
  - model/mlp_policy@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "junpu_sac_mlp"
    logger_backends: ["tensorboard"]  # add "wandb" or "swanlab" as needed

  max_epochs: 5000
  max_steps: -1

  only_eval: false
  val_check_interval: 100   # run eval every 100 epochs
  save_interval: 500        # save checkpoint every 500 epochs

  resume_dir: null
  ckpt_path: null

algorithm:
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"

  update_epoch: 8           # critic+actor update steps per rollout epoch
  critic_actor_ratio: 2     # critic updates per actor update
  group_size: 1
  rollout_epoch: 1
  eval_rollout_epoch: 1

  agg_q: min
  actor_agg_q: mean
  backup_entropy: true
  bootstrap_type: standard  # "standard" = no bootstrap on termination
  gamma: 0.99               # discount factor
  tau: 0.005                # soft target update rate

  target_entropy: -14       # -action_dim (=-14) is a safe default
  entropy_tuning:
    alpha_type: softplus     # automatic entropy tuning
    initial_alpha: 0.01
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  # Online replay buffer
  replay_buffer:
    enable_cache: true
    cache_size: 5000          # trajectories kept in memory
    sample_window_size: 5000  # sample from most recent N trajectories
    min_buffer_size: 2        # start training after 2 trajectories
    auto_save: false

  # Demo buffer (optional — omit or set load_path: null to disable)
  # Load a pre-converted checkpoint with convert_demos_to_buffer.py.
  # When present, 50% of each training batch is drawn from this buffer.
  demo_buffer:
    enable_cache: true
    cache_size: 50            # all 10 demos fit in memory
    sample_window_size: 50
    min_buffer_size: 1        # start mixing demos as soon as 1 trajectory loaded
    auto_save: false
    load_path: null           # set to /path/to/demo_buffer or pass via CLI

  target_update_freq: 1
  target_update_type: all

  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: 14
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 1         # one simulation container
    group_size: 1             # required by validator (SAC uses 1)
    max_steps_per_rollout_epoch: 4   # steps collected before each training update
    max_episode_steps: 300
    auto_reset: true
    ignore_terminations: false
    use_rel_reward: false
    reward_coef: 1.0
    is_eval: false
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    total_num_envs: 1
    group_size: 1             # required by validator
    max_steps_per_rollout_epoch: 300  # full episode for eval
    max_episode_steps: 300
    auto_reset: true
    ignore_terminations: false
    use_rel_reward: false
    reward_coef: 1.0
    is_eval: true
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true   # SAC requires (s, a, r, s') transitions
  collect_prev_infos: false

  model:
    model_path: ""
    precision: ${actor.model.precision}

  enable_torch_compile: false
  enable_cuda_graph: false

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: false
  enable_drq: false         # data augmentation; enable if using image obs

  model:
    model_type: mlp_policy
    model_path: ""
    policy_setup: "g2-ee"    # EE-space control; no pre-trained model needed
    obs_dim: 40              # state_dim = 28 joint + 12 EE
    action_dim: 14           # [pos_l(3), rpy_l(3), pos_r(3), rpy_r(3), grip_l, grip_r]
    num_action_chunks: 1
    hidden_dim: 256
    precision: "32"
    add_value_head: false    # SAC uses Q-heads, not value head
    add_q_head: true
    num_q_heads: 2
    is_lora: false
    lora_rank: 32

  optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_liger_kernel: false
    fsdp_size: -1
    amp_autocast:
      enabled: false
      precision: "bf16"
    grad_scaler:
      enabled: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
