env_type: geniesim
total_num_envs: null

# Physics backend: "mujoco" (default, N separate processes) or
# "mjx" (single JAX vmap process, GPU-parallel, requires JAX + mujoco.mjx).
backend: mujoco
mjx_publish_tf: false   # set true to publish tf_render for IsaacSim when backend=mjx

auto_reset: true
ignore_terminations: false
reward_coef: 1.0
use_rel_reward: false
enable_reward: false   # disable during initial testing; enable once RewardComputer is verified
seed: 42
max_episode_steps: 300
video_cfg: {}

# ---- Object alias map ----
# Maps a short human-readable name to the internal identifiers used by the
# simulation stack.  Reference these names in the randomization config below.
#
#   mujoco_body — body name inside the MuJoCo XML / physics simulation
#   usd_prim    — prim path inside the Isaac Sim USD scene
object_map:
  block:
    mujoco_body: "/World/objects/benchmark_building_blocks_e4e8268e"
    usd_prim:    "/World/Objects/benchmark_building_blocks_e4e8268e"
    description: "Target block (to be picked up)"
  box:
    mujoco_body: "/World/objects/benchmark_building_blocks_0f256c95"
    usd_prim:    "/World/Objects/benchmark_building_blocks_0f256c95"
    description: "Target box (placement goal)"
  table:
    mujoco_body: "/World/objects/table_74eee47f"
    usd_prim:    "/World/Objects/table_74eee47f"
    description: "Workspace table"
  distractor_1:
    mujoco_body: "/World/objects/benchmark_building_blocks_f70dd749"
    usd_prim:    "/World/Objects/benchmark_building_blocks_f70dd749"
  distractor_2:
    mujoco_body: "/World/objects/benchmark_building_blocks_399e77de"
    usd_prim:    "/World/Objects/benchmark_building_blocks_399e77de"
  distractor_3:
    mujoco_body: "/World/objects/benchmark_building_blocks_2fa584ce"
    usd_prim:    "/World/Objects/benchmark_building_blocks_2fa584ce"
  distractor_4:
    mujoco_body: "/World/objects/benchmark_building_blocks_a3803eb3"
    usd_prim:    "/World/Objects/benchmark_building_blocks_a3803eb3"

# ---- Per-reset randomization ----
# Each section can be independently enabled/disabled.
# Reference objects by their short alias from object_map above.
randomization:
  # Robot mobile base pose offset (applied to the free joint of body base_link).
  robot_base:
    enabled: false
    body_name: base_link       # MuJoCo body name (robot base has no alias)
    distribution: uniform      # uniform | gaussian
    pos_x: [-0.05, 0.05]       # [lo, hi] metres offset from default
    pos_y: [-0.05, 0.05]
    yaw:   [-0.1, 0.1]         # radians offset from default yaw

  # Gaussian noise on the 14 arm joint initial positions.
  arm_joints:
    enabled: false
    distribution: gaussian
    std: 0.05                  # radians, noise std per joint (clamped to joint limits)

  # Per-object position randomization.  Use 'name' (alias from object_map above).
  objects:
    enabled: false
    items:
      - name: block            # target block — pick target
        distribution: uniform
        pos_x: [-0.12, 0.12]   # metres offset from default x=0.6268
        pos_y: [-0.08, 0.08]   # metres offset from default y=0.245
        # pos_z: omit to keep z fixed (object stays on table surface)
      - name: box              # target box — place goal
        distribution: uniform
        pos_x: [-0.05, 0.05]
        pos_y: [-0.04, 0.04]

init_params:
  id: place_block_into_box
  task_description: "Pick up the red block and place it inside the box."

  # ---- Asset paths (absolute) ----
  mjcf_path: /home/zy/code/rlinf_open_source/g2sim/mujoco_assets/model/place_block_into_box.xml
  task_file: ""   # leave empty when enable_reward is false

  # ---- Robot ----
  robot_type: G2
  robot_cfg: G2_omnipicker
  state_dim: 28
  action_dim: 14
  # G2 model: 5 body joints come before arm joints in non-free joint order.
  # state_joint_offset=5 skips body joints → states start from arm_l_joint1.
  state_joint_offset: 5
  # G2 model: arm position actuators start at ctrl index 24 (left arm) + 31 (right arm).
  # ctrl_offset=24 maps host actions[0:14] → data.ctrl[24:38] (both arms).
  ctrl_offset: 24

  # ---- Control mode ----
  # joint: actions = [14 arm joints] or [14 arm joints + 2 grippers] when gripper_ctrl_* >= 0
  # ee:    actions = [pos_l(3), euler_xyz_l(3), pos_r(3), euler_xyz_r(3), gripper_l, gripper_r]
  #         IK (damped Jacobian) runs on the simulation side.
  control_mode: joint   # 'joint' or 'ee'
  # G2 + Junpu hand gripper actuator ctrl indices.
  # Set to -1 to exclude grippers from the action space (current default).
  gripper_ctrl_l: -1    # ctrl[52] for G2+junpu; set to 52 to enable
  gripper_ctrl_r: -1    # ctrl[53] for G2+junpu; set to 53 to enable
  # End-effector body names for IK (ee mode only).
  ee_body_l: arm_l_link7
  ee_body_r: arm_r_link7
  # IK solver parameters (ee mode only).
  ik_max_iter: 10       # Jacobian iterations per control step
  ik_damp: 0.05         # damping factor λ for damped least squares

  # ---- Cameras ----
  cam_width:  640
  cam_height: 480
  main_cam_prim:  /camera_main
  wrist_cam_prim: ""   # set to /camera_wrist to enable wrist cam

  # ---- Sim ----
  physics_hz:    1000
  render_hz:     30.0
  headless:      true
  ros_domain_id: 0
  # Paths used in HOST mode (no container).  Ignored when container_cfg is set.
  isaac_python:  /home/zy/isaac-sim-5.1/python.sh
  # Python with mujoco installed.  Use conda/system python, NOT the RLinf venv.
  mujoco_python: /home/zy/anaconda3/bin/python3
  shm_name:      geniesim_frames
  task_instance_id: 0

# ---- Container mode (recommended) ----
# When present, SimContainerManager starts the Docker container and
# GenieSimVectorEnv runs in attach mode.
#
# Host ↔ container communication uses POSIX shared memory only — NO host-side
# ROS installation is required.  SHM is shared via --ipc=host:
#   - Frame SHM    (geniesim_frames):       camera images, written by Isaac Sim
#   - Ctrl SHM     (geniesim_frames_ctrl_N): states / actions / reset per env
#
# Visualization: set headless: false (in init_params above) to get the Isaac
# Sim 3D window.  X11 forwarding is added automatically — no extra_docker_args.
#
# Remove this section to run simulation processes directly on the host instead
# (host ROS environment must be sourced in that case).
container_cfg:
  image:    geniesim-rlinf:latest
  name:     geniesim_rlinf_sim
  geniesim_root: /home/zy/code/rlinf_open_source

  # Container-side path overrides (replace host paths in init_params above).
  container_paths:
    isaac_python:  /isaac-sim/python.sh
    mujoco_python: python3
    mjcf_path: /geniesim/main/g2sim/mujoco_assets/model/place_block_into_box.xml

  # Lifecycle options
  keep_alive:          false  # true = leave container running after env.close()
  reuse_running:       true   # true = skip restart if container is already ready
  startup_timeout_sec: 300    # Isaac Sim cold-start can take ~2-3 min

  ros_domain_id: 0            # must match init_params.ros_domain_id above
  isaac_cache_root: ~/docker/isaac-sim  # host path to Isaac Sim cache/pkg dirs
  extra_docker_args: []       # additional `docker run` flags if needed
